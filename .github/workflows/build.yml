name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write   # attach the installer to GitHub Releases on v* tags

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          arch: win64_msvc2022_64
          modules: "qthttpserver qtwebsockets"
          cache: true

      # CMakeLists.txt generates icon.ico from logo-rsm.png with ImageMagick.
      # The windows-latest image normally ships it; install only if missing.
      - name: Ensure ImageMagick
        shell: pwsh
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick -y --no-progress
            Get-ChildItem "C:\Program Files\ImageMagick*" -Directory |
              Select-Object -First 1 -ExpandProperty FullName |
              Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }

      # Map GitHub context onto the GitLab-style variables CMakeLists.txt
      # consumes for VERSION / PROJECT_VERSION_NAME / log folder branch name.
      - name: Set version environment
        shell: pwsh
        run: |
          $slug = "${{ github.ref_name }}".ToLower() -replace '[^a-z0-9]+', '-' -replace '^-+|-+$', ''
          "CI_PIPELINE_ID=${{ github.run_number }}" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CI_JOB_ID=${{ github.run_number }}"      | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CI_COMMIT_REF_SLUG=$slug"                 | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # Release builds (main, v* tags) log to %ProgramData%\MyRsm\logs.
          $isTag = "${{ github.ref_type }}" -eq 'tag'
          if ($isTag -or "${{ github.ref }}" -eq 'refs/heads/main') {
            "MYRSM_RELEASE=1" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          }
          # Installer version: vX.Y.Z tag -> X.Y.Z, otherwise 0.0.<run>.
          $version = "0.0.${{ github.run_number }}"
          if ($isTag -and "${{ github.ref_name }}" -match '^v(\d+(\.\d+){0,3})') { $version = $Matches[1] }
          "APP_VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "Installer version $version"

      - name: Configure
        shell: pwsh
        run: cmake -B build

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # prometheus_client is pinned: the parity test compares against its
      # text exposition; requests is imported by the reference connector.
      - name: Install Python test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check prometheus_client==0.26.0 requests

      - name: Unit tests (ctest)
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      # Golden parity: every tests/fixtures/*.json through the verbatim
      # reference connector (tools/reference) and through prom::render.
      - name: Parity test vs reference connector
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          python tools/run_parity.py --renderer build/Release/myrsm_render_fixture.exe --keep parity-out
          if ($LASTEXITCODE -ne 0) { throw "parity test failed" }

      - name: Upload parity outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-out-${{ github.run_number }}
          path: parity-out/
          if-no-files-found: ignore

      # Runs the install rules including the Qt deploy script (windeployqt),
      # producing a self-contained folder with myrsm.exe + Qt DLLs.
      - name: Deploy (portable folder)
        shell: pwsh
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/deploy"

      - name: Smoke test (--version)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse "${{ github.workspace }}/deploy" -Filter myrsm.exe | Select-Object -First 1
          if (-not $exe) { throw "myrsm.exe not found in deploy output" }
          & $exe.FullName --version --console
          if ($LASTEXITCODE -ne 0) { throw "--version exited with $LASTEXITCODE" }

      # No HWiNFO on the runner: the routes must still answer, report stale /
      # not-ready, and export no sensor series.
      - name: Smoke test (HTTP routes without HWiNFO)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse "${{ github.workspace }}/deploy" -Filter myrsm.exe | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--console', '--host-label', 'ci-runner' -PassThru -NoNewWindow
          try {
            $base = 'http://127.0.0.1:34567'
            $ok = $false
            for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
              try { $null = Invoke-WebRequest "$base/metrics" -UseBasicParsing -TimeoutSec 2; $ok = $true } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ok) { throw "myrsm did not answer on $base" }

            $m = Invoke-WebRequest "$base/metrics" -UseBasicParsing
            if ($m.StatusCode -ne 200) { throw "/metrics status $($m.StatusCode)" }
            if ($m.Headers['Content-Type'] -ne 'text/plain; version=0.0.4; charset=utf-8') { throw "/metrics content-type '$($m.Headers['Content-Type'])'" }
            foreach ($line in 'hwinfo_exporter_up 0.0', 'hwinfo_exporter_stale 1.0', 'hwinfo_exporter_data_age_seconds 1e+30') {
              if (-not ($m.Content -split "`n" -contains $line)) { throw "missing '$line' in /metrics" }
            }
            if ($m.Content.Contains('_sensor_')) { throw "/metrics exported sensor series without HWiNFO" }

            $h = Invoke-WebRequest "$base/healthz" -UseBasicParsing -SkipHttpErrorCheck
            if ($h.StatusCode -ne 503) { throw "/healthz status $($h.StatusCode), expected 503" }
            $j = $h.Content | ConvertFrom-Json
            if ($j.exporter_up -ne $false -or $j.stale -ne $true) { throw "/healthz body: $($h.Content)" }
            $r = Invoke-WebRequest "$base/readyz" -UseBasicParsing -SkipHttpErrorCheck
            if ($r.StatusCode -ne 503) { throw "/readyz status $($r.StatusCode), expected 503" }

            $root = Invoke-WebRequest "$base/" -UseBasicParsing
            if ($root.Content.Trim() -ne '[]') { throw "/ returned '$($root.Content)'" }
            Write-Host "HTTP smoke test passed"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      # The runner is elevated: exercise `myrsm.exe service ...` against the
      # real SCM, including START_PENDING -> STOPPED with an exit code on a
      # port clash, and SCM restart-on-failure after the process is killed.
      - name: Service lifecycle test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path "${{ github.workspace }}/deploy/bin/myrsm.exe").Path
          function Svc([string]$cmd, [int]$expect = 0) {
            $out = & $exe service $cmd 2>&1 | Out-String
            Write-Host "> myrsm service $cmd (exit $LASTEXITCODE)`n$out"
            if ($LASTEXITCODE -ne $expect) { throw "service $cmd exited $LASTEXITCODE, expected $expect" }
            return $out
          }
          function WaitState([string]$state, [int]$seconds = 20) {
            for ($i = 0; $i -lt $seconds * 2; $i++) {
              $s = Get-Service MyRsm -ErrorAction SilentlyContinue
              if ($s -and $s.Status -eq $state) { return }
              Start-Sleep -Milliseconds 500
            }
            throw "MyRsm did not reach $state within $seconds s"
          }

          $null = Svc status 4
          $null = Svc bogus 2
          $null = Svc install
          $key = Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Services\MyRsm
          if ($key.ImagePath -ne "`"$exe`"") { throw "ImagePath is '$($key.ImagePath)'" }
          if ($key.Start -ne 2) { throw "Start type $($key.Start), expected 2 (automatic)" }
          if ($key.DelayedAutostart -ne 1) { throw "DelayedAutostart is '$($key.DelayedAutostart)'" }
          if ($key.ObjectName -ne 'LocalSystem') { throw "Account is '$($key.ObjectName)'" }
          $qf = sc.exe qfailure MyRsm | Out-String
          Write-Host $qf
          if (([regex]::Matches($qf, 'RESTART -- Delay = 5000')).Count -ne 3) { throw "expected 3 restart actions" }
          if ($qf -notmatch 'RESET_PERIOD \(in seconds\)\s*:\s*86400') { throw "reset period is not 86400" }
          $null = Svc install   # idempotent update

          # Port clash: configure() fails -> STOPPED with a service-specific exit code.
          # Dual-stack (IPv6Any + IPv4), like MyRsm's QHostAddress::Any listener.
          $blocker = [System.Net.Sockets.TcpListener]::Create(34567)
          $blocker.Start()
          try {
            $null = Svc start 1
            $st = Svc status
            if ($st -notmatch 'service-specific exit code 1') { throw "expected service-specific exit code 1" }
          } finally { $blocker.Stop() }
          # Recovery also covers non-crash failures: SCM restarts it after 5 s.
          WaitState Running 30

          $h = Invoke-WebRequest http://127.0.0.1:34567/healthz -UseBasicParsing -SkipHttpErrorCheck
          if ($h.StatusCode -ne 503) { throw "/healthz via service: $($h.StatusCode)" }

          # Killed process -> SCM restarts it.
          $pid1 = (Get-CimInstance Win32_Service -Filter "Name='MyRsm'").ProcessId
          Stop-Process -Id $pid1 -Force
          Start-Sleep -Seconds 2
          WaitState Running 30
          $pid2 = (Get-CimInstance Win32_Service -Filter "Name='MyRsm'").ProcessId
          if ($pid2 -eq $pid1 -or $pid2 -eq 0) { throw "service was not restarted (pid $pid1 -> $pid2)" }

          $null = Svc stop
          WaitState Stopped 5
          $null = Svc stop        # already stopped: still 0
          $null = Svc start
          $null = Svc uninstall
          $null = Svc status 4
          $null = Svc uninstall   # not installed: still 0

          $log = Get-ChildItem "$env:ProgramData\MyRsm\logs*\*.txt" -ErrorAction SilentlyContinue |
                 Select-String -Pattern 'Service running.' -SimpleMatch
          if (-not $log) { throw "no 'Service running.' line in %ProgramData%\MyRsm\logs*" }
          Write-Host "Service lifecycle test passed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: myrsm-win64-${{ github.run_number }}
          path: deploy/
          if-no-files-found: error

      # Inno Setup installer. The VC++ runtime isn't part of the windeployqt
      # output, so the runner's matching vc_redist.x64.exe is bundled and run
      # only when the target's runtime is missing or older.
      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory |
                    Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' } |
                    Sort-Object { [version]$_.Name } -Descending |
                    ForEach-Object { Join-Path $_.FullName 'vc_redist.x64.exe' } |
                    Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $redist) { throw "vc_redist.x64.exe not found under $vs\VC\Redist\MSVC" }
          $vi = (Get-Item $redist).VersionInfo
          Write-Host "Bundling $redist ($($vi.FileVersion))"

          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" `
                  "/DSourceDir=${{ github.workspace }}\deploy" `
                  "/DIconFile=${{ github.workspace }}\build\icon.ico" `
                  "/DVCRedist=$redist" "/DVCRedistMinor=$($vi.FileMinorPart)" "/DVCRedistBld=$($vi.FileBuildPart)" `
                  "/O${{ github.workspace }}\installer-out" installer\myrsm.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      # Silent install -> checks -> ini edit + restart -> upgrade -> uninstall.
      - name: Installer test (silent)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "${{ github.workspace }}\installer-out"
          $setup = (Get-ChildItem "$out\MyRsm-Setup-*.exe" | Select-Object -First 1).FullName
          $app = "$env:ProgramFiles\MyRsm"
          $ini = "$env:ProgramData\MyRsm\myrsm.ini"
          function RunSetup([string]$exe, [string[]]$extra, [string]$log) {
            $p = Start-Process $exe -ArgumentList (@('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$out\$log") + $extra) -Wait -PassThru
            Write-Host "$exe -> exit $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { Get-Content "$out\$log" -ErrorAction SilentlyContinue | Select-Object -Last 60; throw "$log failed" }
          }
          function Healthz([int]$port) {
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $r = Invoke-WebRequest "http://127.0.0.1:$port/healthz" -UseBasicParsing -SkipHttpErrorCheck -TimeoutSec 2
                if ($r.StatusCode -in 200, 503) { return $r }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            throw "nothing answered on port $port"
          }
          Remove-Item $ini -ErrorAction SilentlyContinue

          RunSetup $setup @('/HTTPPORT=34990', '/WSPORT=34991', '/HOSTLABEL=ci-runner', '/FWSCOPE=127.0.0.1') 'install.log'
          if (-not (Test-Path "$app\bin\myrsm.exe")) { throw "not installed to $app" }
          $key = Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Services\MyRsm
          if ($key.ImagePath -ne "`"$app\bin\myrsm.exe`"") { throw "ImagePath '$($key.ImagePath)'" }
          if ((Get-Service MyRsm).Status -ne 'Running') { throw "service not running" }
          $iniText = Get-Content $ini -Raw
          Write-Host $iniText
          foreach ($l in 'http_port=34990', 'ws_port=34991', 'host_label=ci-runner', 'metric_prefix=hwinfo', 'compat_source_label=false') {
            if ($iniText -notmatch [regex]::Escape($l)) { throw "ini lacks $l" }
          }
          $rule = Get-NetFirewallRule -DisplayName 'MyRsm HTTP' -ErrorAction SilentlyContinue
          if (-not $rule) { throw "firewall rule missing" }
          $port = ($rule | Get-NetFirewallPortFilter).LocalPort
          $remote = ($rule | Get-NetFirewallAddressFilter).RemoteAddress
          if ($port -ne '34990' -or $remote -notcontains '127.0.0.1') { throw "firewall rule port=$port remote=$remote" }
          $null = Healthz 34990
          if (-not (Select-String "$out\install.log" -Pattern 'Health check' -SimpleMatch)) { throw "no health check in setup log" }

          # Edit the ini + restart: new port answers.
          (Get-Content $ini) -replace '^http_port=.*', 'http_port=34992' | Set-Content $ini -Encoding ascii
          Restart-Service MyRsm
          $null = Healthz 34992

          # Upgrade in place with no parameters: ini preserved, no locked files.
          RunSetup $setup @() 'upgrade.log'
          if ((Get-Content $ini -Raw) -notmatch 'http_port=34992') { throw "upgrade did not keep the ini port" }
          if ((Get-Content $ini -Raw) -notmatch 'host_label=ci-runner') { throw "upgrade did not keep the host label" }
          $null = Healthz 34992

          # Uninstall: service, rule and program folder gone, ProgramData kept.
          RunSetup "$app\unins000.exe" @() 'uninstall.log'
          for ($i = 0; $i -lt 60 -and ((Get-Service MyRsm -ErrorAction SilentlyContinue) -or (Test-Path "$app\bin")); $i++) { Start-Sleep 1 }
          if (Get-Service MyRsm -ErrorAction SilentlyContinue) { throw "service still present" }
          if (Test-Path "$app\bin") { throw "$app\bin still present" }
          if (Get-NetFirewallRule -DisplayName 'MyRsm HTTP' -ErrorAction SilentlyContinue) { throw "firewall rule still present" }
          if (-not (Test-Path $ini)) { throw "silent uninstall removed $ini without /PURGEDATA" }
          Write-Host "Installer test passed"

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MyRsm-Setup-${{ github.run_number }}
          path: installer-out/
          if-no-files-found: ignore

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer-out/MyRsm-Setup-*.exe
